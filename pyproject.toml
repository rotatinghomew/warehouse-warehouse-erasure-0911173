[project]
name = "warehouse-erasure"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["duckdb==1.4.3"]

[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["privacywarehouse"]

[tool.unittest]
start-directory = "tests"
